name: CI

on:
  pull_request:
    branches: [demo, main]
  push:
    branches: [demo, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d financeiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://financeiro:financeiro@localhost:5432/financeiro_test
      TEST_DATABASE_URL: postgresql://financeiro:financeiro@localhost:5432/financeiro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn generate

      - name: Type-check
        run: yarn type-check

      - name: Apply migrations
        run: yarn migrate:deploy

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só valida que a imagem constrói; o push/deploy fica para quando houver servidor definido
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
